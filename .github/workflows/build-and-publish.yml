# 완전 무료 자동 릴스 파이프라인
# 매일 06/12/18시 KST 실행
name: Build and publish reel

on:
  schedule:
    - cron: "0 21,3,9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (릴리즈/웹훅 안 함)"
        required: false
        default: "false"
      force:
        description: "새 글 없어도 강제로 하나 만들기 (디버그용)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: reel-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-nanum

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build feed (crawl)
        env:
          PYTHONPATH: src
        run: python src/build_feed.py --per-source 15

      - name: Produce reel
        id: produce
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -x
          ls -la output/ || true
          echo "=== 피드 통과 기사 ==="
          python -c "import json; d=json.load(open('output/policy-feed.json',encoding='utf-8')); print(len(d),'건'); [print(' -',x['source'],x['title'][:60]) for x in d[:10]]" || true
          echo "=== produce_reel 실행 ==="
          python src/produce_reel.py || echo "produce_reel 종료 코드 $?"
          echo "=== output after ==="
          ls -la output/
          MP4=$(ls -t output/reel_*.mp4 2>/dev/null | head -1 || true)
          META="${MP4%.mp4}.json"
          if [ -z "$MP4" ] || [ ! -f "$MP4" ]; then
            echo "mp4=" >> "$GITHUB_OUTPUT"
            echo "meta=" >> "$GITHUB_OUTPUT"
            echo "::warning::새로 만들 영상이 없습니다."
            exit 0
          fi
          echo "mp4=$MP4" >> "$GITHUB_OUTPUT"
          echo "meta=$META" >> "$GITHUB_OUTPUT"
          echo "MP4_SIZE=$(stat -c%s "$MP4")" >> "$GITHUB_ENV"
          echo "Created $MP4 ($(stat -c%s "$MP4") bytes)"

      - name: Upload to GitHub Release (API)
        id: release
        if: steps.produce.outputs.mp4 != '' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MP4: ${{ steps.produce.outputs.mp4 }}
          TAG: reel-${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ASSET_NAME=$(basename "$MP4")
          echo "릴리즈 태그: $TAG / 파일: $ASSET_NAME"

          # 1) 릴리즈 생성
          CREATE_RESP=$(curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Reel $TAG\",\"body\":\"Auto-generated reel ${{ github.run_id }}\"}")
          echo "$CREATE_RESP" | head -c 800; echo
          RELEASE_ID=$(echo "$CREATE_RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          UPLOAD_URL=$(echo "$CREATE_RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["upload_url"])')
          UPLOAD_URL="${UPLOAD_URL%%\{*}"

          # 2) asset 업로드
          UPLOAD_RESP=$(curl -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: video/mp4" \
            --data-binary @"$MP4" \
            "$UPLOAD_URL?name=$ASSET_NAME")
          DL_URL=$(echo "$UPLOAD_RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin)["browser_download_url"])')
          echo "video_url=$DL_URL" >> "$GITHUB_OUTPUT"
          echo "✅ $DL_URL"

      - name: Commit state & feed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # mp4는 git으로 커밋하지 않게 강제
          git rm --cached -r output/reel_*.mp4 2>/dev/null || true
          git add output/policy-feed.xml output/policy-feed.json output/state.json output/.gitkeep 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "chore: refresh feed & state $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi

      - name: Notify Make webhook
        if: steps.release.outputs.video_url != ''
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          VIDEO_URL: ${{ steps.release.outputs.video_url }}
          META_FILE: ${{ steps.produce.outputs.meta }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$MAKE_WEBHOOK_URL" ]; then
            echo "MAKE_WEBHOOK_URL 시크릿 없음 — 웹훅 전송 생략"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          meta = json.load(open(os.environ["META_FILE"], encoding="utf-8"))
          payload = {
              "video_url": os.environ["VIDEO_URL"],
              "caption": meta.get("caption", ""),
              "title": meta.get("title", ""),
              "source": meta.get("source", ""),
              "article_url": meta.get("url", ""),
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              os.environ["MAKE_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print("webhook 응답:", r.status)
              print(r.read().decode("utf-8")[:500])
          PY
